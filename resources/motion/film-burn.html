<div class="b" id="b"></div>
<style>.b{position:absolute;inset:-10%;mix-blend-mode:screen}</style>
<script>
(function(){
  var b = document.getElementById('b'), P = AICUT.params;
  AICUT.onFrame(function(t){
    var D = AICUT.duration, mid = D / 2;
    var a = Math.max(0, 1 - Math.abs(t - mid) / (D / 2));
    var e = Math.pow(a, 1.2);
    var x1 = 30 + 40 * Math.sin(t * 1.7), y1 = 40 + 30 * Math.cos(t * 1.3), x2 = 70 - 35 * Math.sin(t * 1.1), y2 = 60 + 25 * Math.sin(t * 2.1);
    b.style.background =
      'radial-gradient(circle at ' + x1 + '% ' + y1 + '%, ' + P.color1 + ' 0%, transparent ' + (25 + 45 * e) + '%),' +
      'radial-gradient(circle at ' + x2 + '% ' + y2 + '%, ' + P.color2 + ' 0%, transparent ' + (20 + 50 * e) + '%),' +
      'radial-gradient(circle at 50% 50%, rgba(255,250,235,' + (e > 0.8 ? (e - 0.8) * 5 : 0) + ') 0%, rgba(255,250,235,' + (e > 0.8 ? (e - 0.8) * 5 : 0) + ') 100%)';
    b.style.opacity = String(Math.min(1, e * 1.6) * (+P.intensity || 1));
  });
})();
</script>
