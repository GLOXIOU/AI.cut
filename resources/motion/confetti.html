<canvas id="c"></canvas>
<style>#c{position:absolute;inset:0;width:100%;height:100%}</style>
<script>
(function(){
  var W = AICUT.width, H = AICUT.height, cv = document.getElementById('c'); cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d'), P = AICUT.params;
  var colors = String(P.colors || '#ff3b6b,#ffd43b,#4dabf7,#69db7c,#b197fc,#ff922b').split(',').map(function(s){ return s.trim(); });
  var n = Math.min(600, Number(P.count) || 220), seed = 42;
  function r(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var parts = [];
  for (var i = 0; i < n; i++) {
    var fromSide = P.mode === 'cannons' ? (i % 2 ? 1 : -1) : 0;
    parts.push({
      x: fromSide ? (fromSide < 0 ? -20 : W + 20) : r() * W, y: fromSide ? H * 0.8 : -r() * H * 0.6 - 20,
      vx: fromSide ? -fromSide * (0.35 + r() * 0.45) * W : (r() - 0.5) * W * 0.15, vy: fromSide ? -(0.6 + r() * 0.6) * H : (0.15 + r() * 0.25) * H,
      w: (10 + r() * 14) * Math.min(W, H) / 1080, h: (6 + r() * 10) * Math.min(W, H) / 1080, rot: r() * 6.28, vr: (r() - 0.5) * 14, c: colors[i % colors.length], ph: r() * 6.28, delay: r() * 0.4,
    });
  }
  var g = H * (P.mode === 'cannons' ? 1.3 : 0.35);
  AICUT.onFrame(function(t){
    ctx.clearRect(0, 0, W, H);
    var fade = 1 - AICUT.progress(t, AICUT.duration - 0.6, 0.6);
    parts.forEach(function(p){
      var tt = Math.max(0, t - p.delay); if (tt <= 0) return;
      var drag = P.mode === 'cannons' ? Math.exp(-1.2 * tt) : 1;
      var x = p.x + p.vx * (P.mode === 'cannons' ? (1 - Math.exp(-1.2 * tt)) / 1.2 : tt) + Math.sin(p.ph + tt * 4) * 30 * Math.min(W, H) / 1080;
      var y = p.y + p.vy * (P.mode === 'cannons' ? (1 - Math.exp(-1.2 * tt)) / 1.2 : tt) + 0.5 * g * tt * tt * (P.mode === 'cannons' ? 0.6 : 1);
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(x, y); ctx.rotate(p.rot + p.vr * tt);
      ctx.scale(1, Math.cos(p.ph + tt * 9)); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      void drag;
    });
  });
})();
</script>
