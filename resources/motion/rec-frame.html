<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="rec"><span class="dot" id="dot"></span>REC</div>
<div class="tc" id="tc">00:00:00:00</div>
<div class="bat">▮▮▮▯ {{label}}</div>
<style>
:root{--m:calc(var(--k) * .05);--s:calc(var(--k) * .07);--b:calc(var(--k) * .005)}
body{font:700 calc(var(--k) * .032) 'Roboto Mono', monospace;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);animation:fade .3s ease both}
.corner{position:absolute;width:var(--s);height:var(--s);border-color:#fff;border-style:solid;border-width:0}
.tl{left:var(--m);top:var(--m);border-left-width:var(--b);border-top-width:var(--b)}
.tr{right:var(--m);top:var(--m);border-right-width:var(--b);border-top-width:var(--b)}
.bl{left:var(--m);bottom:var(--m);border-left-width:var(--b);border-bottom-width:var(--b)}
.br{right:var(--m);bottom:var(--m);border-right-width:var(--b);border-bottom-width:var(--b)}
.rec{position:absolute;left:calc(var(--m) * 1.9);top:calc(var(--m) * 1.5);display:flex;align-items:center;gap:.4em}
.dot{width:.7em;height:.7em;border-radius:50%;background:#ff2d2d;box-shadow:0 0 10px #ff2d2d}
.tc{position:absolute;right:calc(var(--m) * 1.9);top:calc(var(--m) * 1.5)}
.bat{position:absolute;right:calc(var(--m) * 1.9);bottom:calc(var(--m) * 1.5);font-size:.8em}
@keyframes fade{from{opacity:0}}
</style>
<script>
(function(){
  var tc = document.getElementById('tc'), dot = document.getElementById('dot'), fps = AICUT.fps, off = Number(AICUT.params.startAt) || 0;
  function p(n){ return String(n).padStart(2, '0'); }
  AICUT.onFrame(function(t){
    var s = t + off, f = Math.floor((s % 1) * fps);
    tc.textContent = p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(Math.floor(s) % 60) + ':' + p(f);
    dot.style.opacity = Math.floor(t * 1.5) % 2 === 0 ? 1 : 0.15;
  });
})();
</script>
