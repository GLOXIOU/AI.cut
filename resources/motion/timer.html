<div class="w"><svg viewBox="0 0 100 100" class="ring"><circle cx="50" cy="50" r="44" class="bg"/><circle cx="50" cy="50" r="44" class="fg" id="fg"/></svg><div class="t" id="t">0:00</div></div>
<style>
.w{position:absolute;left:{{x}}%;top:{{y}}%;transform:translate(-50%,-50%);width:calc(var(--k)*{{size}}/1080);height:calc(var(--k)*{{size}}/1080);display:flex;align-items:center;justify-content:center;animation:in .5s cubic-bezier(.2,1.3,.4,1) both, out .35s ease-in calc(var(--dur) - .35s) both}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.bg{fill:rgba(0,0,0,.55);stroke:rgba(255,255,255,.2);stroke-width:6}
.fg{fill:none;stroke:{{color}};stroke-width:6;stroke-linecap:round;stroke-dasharray:276.46}
.t{position:relative;font:800 calc(var(--k)*{{size}}/1080*.26) "{{font}}",Inter,sans-serif;color:#fff;font-variant-numeric:tabular-nums}
@keyframes in{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
@keyframes out{to{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
</style>
<script>
(function(){
  var P = AICUT.params, el = document.getElementById('t'), fg = document.getElementById('fg');
  var from = Number(P.from) || 0, to = P.to === '' || P.to === undefined ? AICUT.duration : Number(P.to);
  AICUT.onFrame(function(t){
    var p = AICUT.clamp(t / Math.max(0.01, AICUT.duration), 0, 1);
    var v = Math.max(0, from + (to - from) * p);
    var s = Math.floor(v), m = Math.floor(s / 60);
    el.textContent = m + ':' + String(s % 60).padStart(2, '0');
    fg.style.strokeDashoffset = String(276.46 * (1 - p));
  });
})();
</script>
