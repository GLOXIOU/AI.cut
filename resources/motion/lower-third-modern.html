<div class="exit"><div class="lt">
  <div class="accent"></div>
  <div class="body">
    <div class="name"><span>{{name}}</span></div>
    <div class="role"><span>{{title}}</span></div>
  </div>
</div></div>
<style>
.exit{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:{{side}};padding:0 6%;animation:out .5s cubic-bezier(.7,0,.8,.2) calc(var(--dur) - .5s) both}
.lt{display:flex;align-items:stretch;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
.accent{width:calc(var(--k) * .012);background:{{accent}};border-radius:4px;transform-origin:bottom;animation:grow .5s cubic-bezier(.6,0,.2,1) both}
.body{background:{{background}};padding:calc(var(--k) * .018) calc(var(--k) * .03);clip-path:inset(0 100% 0 0);animation:wipe .6s cubic-bezier(.7,0,.2,1) .2s both}
.name,.role{overflow:hidden}
.name span{display:inline-block;font:800 calc(var(--k) * .048) / 1.15 '{{font}}', Montserrat, sans-serif;color:{{color}};animation:up .55s cubic-bezier(.2,.9,.3,1) .45s both}
.role span{display:inline-block;font:500 calc(var(--k) * .029) / 1.3 Inter, sans-serif;color:{{color}};opacity:.82;letter-spacing:.04em;animation:up .55s cubic-bezier(.2,.9,.3,1) .6s both}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes up{from{transform:translateY(105%)}}
@keyframes out{to{transform:translateX(-40px);opacity:0}}
</style>
