<div class="exit"><div class="box"><span id="t"></span><span class="cur" id="c">▍</span></div></div>
<style>
.exit{position:absolute;inset:0;display:flex;align-items:{{valign}};justify-content:center;padding:8% 7%;box-sizing:border-box;animation:out .35s ease-in calc(var(--dur) - .35s) both}
.box{font:700 calc(var(--k) * {{size}} / 1080) / 1.3 'Roboto Mono', monospace;color:{{color}};background:{{background}};padding:.35em .6em;border-radius:.2em;max-width:88%;white-space:pre-wrap}
.cur{color:{{accent}}}
@keyframes out{to{opacity:0}}
</style>
<script>
(function(){
  var text = String(AICUT.params.text || ''), t = document.getElementById('t'), c = document.getElementById('c');
  var speed = Number(AICUT.params.cps) || 22;
  AICUT.onFrame(function(time){
    var n = Math.min(text.length, Math.floor(time * speed));
    t.textContent = text.slice(0, n);
    c.style.visibility = n < text.length || Math.floor(time * 2.2) % 2 === 0 ? 'visible' : 'hidden';
  });
})();
</script>
