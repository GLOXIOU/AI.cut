<div class="exit"><div class="pill">
  <div class="ico" id="ico"></div>
  <div class="handle"><span>{{handle}}</span></div>
</div></div>
<style>
.exit{position:absolute;left:0;right:0;top:{{top}}%;display:flex;justify-content:{{side}};padding:0 5%;animation:out .45s ease-in calc(var(--dur) - .45s) both}
.pill{display:flex;align-items:center;gap:calc(var(--k) * .016);background:{{background}};padding:calc(var(--k) * .012) calc(var(--k) * .03) calc(var(--k) * .012) calc(var(--k) * .012);border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:in .6s cubic-bezier(.2,1.4,.4,1) both}
.ico{width:calc(var(--k) * .06);height:calc(var(--k) * .06);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;animation:spin .7s cubic-bezier(.2,1.2,.4,1) .15s both}
.ico svg{width:58%;height:58%}
.handle{overflow:hidden}
.handle span{display:inline-block;font:700 calc(var(--k) * .036) Inter, sans-serif;color:{{color}};animation:slide .5s cubic-bezier(.2,.9,.3,1) .35s both}
@keyframes in{from{transform:scale(.4);opacity:0}}
@keyframes spin{from{transform:rotate(-180deg) scale(0)}}
@keyframes slide{from{transform:translateX(-110%)}}
@keyframes out{to{transform:scale(.8);opacity:0}}
</style>
<script>
(function(){
  var icons = {
    youtube: ['#ff0033', '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 15.5v-7l6 3.5z"/></svg>'],
    instagram: ['linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)', '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.3" fill="currentColor"/></svg>'],
    tiktok: ['#111', '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 3c.3 2.2 1.6 3.6 3.8 3.8v3.1a7 7 0 0 1-3.8-1.2v6.1a5.6 5.6 0 1 1-5.6-5.6h.6v3.2a2.5 2.5 0 1 0 1.8 2.4V3z"/></svg>'],
    x: ['#000', '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/></svg>'],
    twitch: ['#9146ff', '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 3 3 6v13h4v2h3l2-2h3l5-5V3zm15 10-3 3h-4l-2 2v-2H7V5h12zM15 7h2v5h-2zm-5 0h2v5h-2z"/></svg>'],
    web: ['#2563eb', '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>']
  };
  var it = icons[AICUT.params.platform] || icons.youtube, el = document.getElementById('ico');
  el.style.background = it[0]; el.innerHTML = it[1];
})();
</script>
