<div class="exit"><div class="card" id="card"><img id="img" src="{{src|attr}}"></div></div>
<style>
.exit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:out .4s ease-in calc(var(--dur) - .4s) both}
.card{max-width:{{maxSize}}%;max-height:{{maxSize}}%;border-radius:calc(var(--k) * {{radius}} / 1080);overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);animation:in .7s cubic-bezier(.2,1.5,.4,1) both;border:calc(var(--k) * {{border}} / 1080) solid #fff;background:#fff}
.card img{display:block;max-width:100%;max-height:calc(var(--k) * {{maxSize}} / 100)}
@keyframes in{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate({{tilt}}deg);opacity:1}}
@keyframes out{to{transform:scale(.6);opacity:0}}
</style>
