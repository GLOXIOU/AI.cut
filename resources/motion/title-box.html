<div class="wrap"><div class="box" id="box"><svg id="svg"><rect id="r" x="2" y="2" rx="6"/></svg><div class="t">{{text}}</div></div></div>
<style>
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:out .4s ease-in calc(var(--dur) - .4s) both}
.box{position:relative;padding:calc(var(--k)*.03) calc(var(--k)*.05)}
.t{font:800 calc(var(--k)*{{size}}/1080) "{{font}}",Inter,sans-serif;color:{{color}};letter-spacing:.04em;text-transform:uppercase;animation:fade .6s ease-out .45s both}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
rect{fill:none;stroke:{{accent}};stroke-width:calc(var(--k)*.005);width:calc(100% - 4px);height:calc(100% - 4px);stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;letter-spacing:.3em}}
@keyframes out{to{opacity:0;transform:scale(.96)}}
</style>
<script>(function(){var r=document.getElementById('r'),b=document.getElementById('box');var w=b.offsetWidth,h=b.offsetHeight;document.documentElement.style.setProperty('--len',String(2*(w+h)));})();</script>
