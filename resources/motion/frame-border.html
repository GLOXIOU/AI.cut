<svg id="s" style="position:absolute;inset:0;width:100%;height:100%"><rect id="r" fill="none"/></svg>
<script>
(function(){
  var P = AICUT.params, W = AICUT.width, H = AICUT.height, k = Math.min(W, H);
  var r = document.getElementById('r');
  var m = (+P.margin || 3) / 100 * k, sw = (+P.thickness || 8) * k / 1080;
  r.setAttribute('x', m); r.setAttribute('y', m); r.setAttribute('width', W - 2 * m); r.setAttribute('height', H - 2 * m);
  r.setAttribute('rx', (+P.radius || 24) * k / 1080); r.setAttribute('stroke', P.color); r.setAttribute('stroke-width', sw);
  var len = 2 * (W + H - 4 * m);
  r.style.strokeDasharray = len;
  AICUT.onFrame(function(t){
    var p = AICUT.ease.inOut(AICUT.progress(t, 0, 1));
    var out = AICUT.progress(t, AICUT.duration - 0.4, 0.4);
    r.style.strokeDashoffset = len * (1 - p);
    r.style.opacity = 1 - out;
  });
})();
</script>
