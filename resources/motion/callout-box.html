<svg id="s" width="100%" height="100%" style="position:absolute;inset:0;overflow:visible"><rect id="r"/></svg>
<div class="lbl" id="lbl">{{label}}</div>
<style>
rect{fill:none;stroke:{{color}};stroke-width:calc(var(--k)*.006);stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .8s cubic-bezier(.6,0,.2,1) both, out .35s ease-in calc(var(--dur) - .35s) both}
.lbl{position:absolute;transform:translateY(-100%);background:{{color}};color:{{textColor}};font:700 calc(var(--k)*.03) "{{font}}",Inter,sans-serif;padding:.25em .6em;border-radius:.3em .3em .3em 0;white-space:nowrap;transform-origin:0 100%;animation:pop .45s cubic-bezier(.2,1.4,.4,1) .6s both, out .35s ease-in calc(var(--dur) - .35s) both}
.lbl:empty{display:none}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:translateY(-60%) scale(.6);opacity:0}}
@keyframes out{to{opacity:0}}
</style>
<script>
(function(){
  var P = AICUT.params, W = AICUT.width, H = AICUT.height, k = Math.min(W, H);
  var x = (+P.x || 0.5) * W, y = (+P.y || 0.5) * H, w = (+P.width || 0.3) * W, h = (+P.height || 0.25) * H;
  var r = document.getElementById('r'), l = document.getElementById('lbl');
  r.setAttribute('x', x - w / 2); r.setAttribute('y', y - h / 2);
  r.setAttribute('width', w); r.setAttribute('height', h);
  r.setAttribute('rx', k * 0.012); r.setAttribute('ry', k * 0.012);
  document.documentElement.style.setProperty('--len', String(2 * (w + h)));
  l.style.left = (x - w / 2 - k * 0.003) + 'px';
  l.style.top = (y - h / 2 - k * 0.003) + 'px';
})();
</script>
