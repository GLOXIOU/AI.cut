<div class="chat" id="chat"></div>
<style>
.chat{position:absolute;left:50%;top:50%;width:min(calc(var(--k)*.9),84%);transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:calc(var(--k)*.018);font-family:Inter,"Segoe UI",sans-serif;animation:out .4s ease-in calc(var(--dur) - .4s) both}
.b{max-width:78%;padding:calc(var(--k)*.02) calc(var(--k)*.03);border-radius:calc(var(--k)*.035);font-size:calc(var(--k)*.036);line-height:1.3;transform-origin:bottom left;opacity:0}
.b.l{align-self:flex-start;background:{{leftColor}};color:{{leftText}};border-bottom-left-radius:calc(var(--k)*.008)}
.b.r{align-self:flex-end;background:{{rightColor}};color:{{rightText}};border-bottom-right-radius:calc(var(--k)*.008);transform-origin:bottom right}
.typing{display:inline-flex;gap:.3em}
.typing i{width:.45em;height:.45em;border-radius:50%;background:currentColor;opacity:.5}
@keyframes out{to{opacity:0}}
</style>
<script>
(function(){
  var P = AICUT.params, chat = document.getElementById('chat');
  var lines = String(P.messages || '').split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean);
  var msgs = lines.map(function(s){ var right = /^>/.test(s); var txt = s.replace(/^[<>]\s*/, ''); var b = document.createElement('div'); b.className = 'b ' + (right ? 'r' : 'l'); b.textContent = txt; chat.appendChild(b); return { b: b, txt: txt }; });
  var per = Math.max(0.6, (AICUT.duration - 1) / Math.max(1, msgs.length));
  AICUT.onFrame(function(t){
    msgs.forEach(function(m, i){
      var t0 = 0.3 + i * per;
      var typing = t >= t0 - 0.45 && t < t0 && m.b.classList.contains('l');
      if (typing) { m.b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; m.b.style.opacity = 1; m.b.style.transform = 'scale(1)';
        var dots = m.b.querySelectorAll('i'); for (var k = 0; k < 3; k++) dots[k].style.opacity = 0.35 + 0.65 * Math.max(0, Math.sin(t * 9 - k));
        return; }
      if (m.b.firstChild && m.b.firstChild.className === 'typing') m.b.textContent = m.txt;
      var a = AICUT.ease.outBack(AICUT.progress(t, t0, 0.35));
      m.b.style.opacity = t >= t0 ? Math.min(1, (t - t0) * 6) : 0;
      m.b.style.transform = 'scale(' + (0.6 + 0.4 * a) + ')';
    });
  });
})();
</script>
