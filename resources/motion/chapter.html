<div class="exit"><div class="ch">
  <div class="num"><span>{{label}}</span></div>
  <div class="line"></div>
  <div class="title"><span>{{title}}</span></div>
</div></div>
<style>
.exit{position:absolute;inset:0;display:flex;align-items:center;justify-content:{{align}};padding:0 8%;animation:out .5s cubic-bezier(.7,0,.8,.2) calc(var(--dur) - .5s) both}
.ch{display:flex;flex-direction:column;align-items:flex-start}
.num,.title{overflow:hidden}
.num span{display:inline-block;font:700 calc(var(--k) * .032) Inter, sans-serif;letter-spacing:.4em;text-transform:uppercase;color:{{accent}};animation:up .6s cubic-bezier(.2,.9,.3,1) .1s both}
.line{height:calc(var(--k) * .005);width:calc(var(--k) * .5);background:linear-gradient(90deg,{{accent}},transparent);margin:calc(var(--k) * .02) 0;transform-origin:left;animation:grow .7s cubic-bezier(.7,0,.2,1) .25s both}
.title span{display:inline-block;font:800 calc(var(--k) * .09) / 1.05 '{{font}}', Montserrat, sans-serif;color:{{color}};text-shadow:0 8px 30px rgba(0,0,0,.4);animation:up .7s cubic-bezier(.2,.9,.3,1) .4s both}
@keyframes up{from{transform:translateY(105%)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes out{to{transform:translateX(-60px);opacity:0}}
</style>
